# ============================================================
#  CONFIGURACION DE APACHE (XAMPP) COMO PROXY INVERSO
#  Pega este bloque al final de:
#  C:\xampp\apache\conf\httpd.conf
#  (o crea C:\xampp\apache\conf\extra\httpd-conciliacion.conf
#   y agrega "Include conf/extra/httpd-conciliacion.conf"
#   en httpd.conf)
#
#  Requisito: habilitar los modulos en httpd.conf:
#    LoadModule proxy_module modules/mod_proxy.so
#    LoadModule proxy_http_module modules/mod_proxy_http.so
# ============================================================

<VirtualHost *:80>
    ServerName localhost
    # Si tiene un dominio/IP fija, cambie localhost por esa direccion:
    # ServerName expedientes.midominio.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Para servir MEDIA/SUBIDAS directo por Apache (opcional):
    # Alias /media "C:/Sistemas/expedientes_conciliacion/media"
    # <Directory "C:/Sistemas/expedientes_conciliacion/media">
    #     Require all granted
    # </Directory>

    ErrorLog "logs/conciliacion_error.log"
    CustomLog "logs/conciliacion_access.log" common
</VirtualHost>
