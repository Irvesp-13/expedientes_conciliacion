{% extends 'base.html' %}

{% block title %}Editar Empleado{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="{% url 'crear_empleado' %}" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left"></i> Regresar
        </a>
        <h2 class="mb-0">Editar Empleado</h2>
        <div style="width: 100px;"></div> <!-- Espaciador para centrar el título -->
    </div>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario:</label>
            <input type="text" class="form-control" id="usuario" name="usuario" value="{{ empleado.usuario }}" required>
        </div>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ empleado.nombre }}" required>
        </div>
        <div class="mb-3">
            <label for="clave_empleado" class="form-label">Clave de Empleado:</label>
            <input type="text" class="form-control" id="clave_empleado" name="clave_empleado" value="{{ empleado.clave_empleado }}" required>
        </div>
        <div class="mb-3">
            <label for="rol" class="form-label">Rol:</label>
            <select class="form-control" id="rol" name="rol" required>
                {% for value, label in roles %}
                <option value="{{ value }}" {% if empleado.rol == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="id_plaza" class="form-label">ID Plaza:</label>
            <input type="text" class="form-control" id="id_plaza" name="id_plaza" value="{{ empleado.id_plaza }}">
        </div>
        <div class="mb-3">
            <label for="puesto" class="form-label">Puesto:</label>
            <input type="text" class="form-control" id="puesto" name="puesto" value="{{ empleado.puesto }}">
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Guardar Cambios
        </button>
        <a href="{% url 'crear_empleado' %}" class="btn btn-secondary">
            <i class="fas fa-times"></i> Cancelar
        </a>
    </form>
</div>
{% endblock %}
