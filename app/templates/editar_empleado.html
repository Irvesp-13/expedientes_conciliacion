{% extends 'base.html' %}

{% block title %}Editar Empleado - CADEX{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header text-white d-flex align-items-center gap-2">
                <i class="fas fa-user-edit fa-lg"></i>
                <h3 class="card-title mb-0">Editar Empleado</h3>
            </div>
            <div class="card-body">
                <a href="{% url 'crear_empleado' %}" class="btn btn-outline-primary btn-sm mb-3">
                    <i class="fas fa-arrow-left"></i> Regresar
                </a>
                <form method="post" id="formEditarEmpleado">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="usuario" name="usuario" value="{{ empleado.usuario }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ empleado.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="clave_empleado" class="form-label">Clave de Empleado</label>
                        <input type="text" class="form-control" id="clave_empleado" name="clave_empleado" value="{{ empleado.clave_empleado }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="rol" class="form-label">Rol</label>
                        <select class="form-control" id="rol" name="rol" required>
                            {% for value, label in roles %}
                            <option value="{{ value }}" {% if empleado.rol == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="id_plaza" class="form-label">ID Plaza</label>
                        <input type="text" class="form-control" id="id_plaza" name="id_plaza" value="{{ empleado.id_plaza }}">
                    </div>
                    <div class="mb-4">
                        <label for="puesto" class="form-label">Puesto</label>
                        <input type="text" class="form-control" id="puesto" name="puesto" value="{{ empleado.puesto }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-fill" id="btnGuardarEmpleado">
                            <i class="fas fa-save"></i> Guardar Cambios
                        </button>
                        <a href="{% url 'crear_empleado' %}" class="btn btn-secondary flex-fill">
                            <i class="fas fa-times"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    document.getElementById('formEditarEmpleado').addEventListener('submit', function(e) {
        const btn = document.getElementById('btnGuardarEmpleado');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner-border spinner-border-sm mr-2" role="status"></div> Guardando...';
    });
</script>
{% endblock %}
