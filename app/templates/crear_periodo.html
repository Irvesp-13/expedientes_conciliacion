{% extends 'base.html' %}

{% block title %}Crear Periodo{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="{% url 'bienvenida' %}" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left"></i> Regresar
        </a>
        <h2 class="mb-0">Crear Nuevo Periodo</h2>
    </div>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="mes" class="form-label">Mes:</label>
                    <select class="form-control" id="mes" name="mes" required>
                        <option value="">Seleccione un mes</option>
                        {% for mes in meses %}
                        <option value="{{ mes }}">{{ mes|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="anio" class="form-label">Año:</label>
                    <input type="number" class="form-control" id="anio" name="anio" required min="2020" max="2030" value="2026">
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-calendar-plus"></i> Crear Periodo
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
