{% extends 'base.html' %}

{% block title %}Página no encontrada - CADEX{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
    <div class="col-lg-7 col-md-9">
        <div class="card shadow text-center border-0">
            <div class="card-header bg-danger text-white py-3">
                <h3 class="card-title mb-0">Error 404</h3>
            </div>
            <div class="card-body py-5 px-4">
                <div class="display-1 font-weight-bold text-danger mb-3">404</div>
                <h4 class="mb-3 text-muted">Página no encontrada</h4>
                <p class="text-muted mb-4">
                    La página que buscas no existe o ha sido eliminada.
                </p>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <a href="{% url 'bienvenida' %}" class="btn btn-agregar btn-lg px-4">
                        <i class="fas fa-home"></i> Volver al inicio
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary btn-lg px-4">
                        <i class="fas fa-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
