{% extends 'base.html' %}

{% block title %}Iniciar Sesión - CADEX{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card shadow-lg">
        <div class="card-header text-white">
            <h4 class="card-title mb-0">
                <i class="fas fa-balance-scale mr-2"></i> CADEX
            </h4>
            <small class="opacity-75">Conciliación y Arbitraje</small>
        </div>
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}
            <form method="post" id="loginForm">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="usuario" name="usuario" 
                               placeholder="Ingresa tu usuario" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="clave_empleado" class="form-label">Clave de empleado</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="clave_empleado" 
                               name="clave_empleado" placeholder="*****" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-agregar btn-lg w-100" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const btn = document.getElementById('btnLogin');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner-border spinner-border-sm mr-2" role="status"></div> Verificando...';
    });
</script>
{% endblock %}
