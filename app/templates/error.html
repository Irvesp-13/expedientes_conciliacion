{% extends 'base.html' %}

{% block title %}Error - CADEX{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
    <div class="col-lg-6 col-md-8">
        <div class="card shadow text-center border-0">
            <div class="card-header bg-danger text-white py-3">
                <h3 class="card-title mb-0"><i class="fas fa-exclamation-triangle mr-2"></i> Error</h3>
            </div>
            <div class="card-body py-5 px-4">
                <div class="display-1 font-weight-bold text-danger mb-3">
                    <i class="fas fa-times-circle"></i>
                </div>
                <h4 class="mb-3">Ha ocurrido un error</h4>
                <p class="text-muted mb-4 lead">{{ mensaje }}</p>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <a href="{% url 'bienvenida' %}" class="btn btn-agregar px-4">
                        <i class="fas fa-home"></i> Volver al Inicio
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary px-4">
                        <i class="fas fa-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        if ('{{ mensaje|escapejs }}') {
            swalError('{{ mensaje|escapejs }}', 'Error');
        }
    });
</script>
{% endblock %}
